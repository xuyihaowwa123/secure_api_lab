# CI/CD SAST + SCA


name: Security CI Pipeline

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: SAST + SCA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 工具版本同样要锁，否则某天上游改了 CLI 就会突然红
          pip install "bandit==1.7.10" "pip-audit>=2.7,<3"

      
      - name: SAST - Bandit
        run: |
          bandit -r . -x ./venv -f json -o bandit-report.json --exit-zero
          bandit -r . -x ./venv -f txt

      # SCA：pip-audit 
      - name: SCA - pip-audit
        run: |
          pip-audit -r requirements.txt --desc --format columns > pip-audit-report.txt
          cat pip-audit-report.txt

      
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.txt
          retention-days: 14
          if-no-files-found: warn
